<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="No image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0f14"/>
      <stop offset="100%" stop-color="#141a22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#32F08C"/>
      <stop offset="100%" stop-color="#17D479"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="rgba(50,240,140,0.10)"/>
      <stop offset="100%" stop-color="rgba(50,240,140,0)"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <rect width="600" height="450" fill="url(#glow)"/>

  <!-- 图片占位图标 -->
  <g transform="translate(300 200)">
    <rect x="-46" y="-38" width="92" height="76" rx="10" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
    <circle cx="-22" cy="-14" r="8" fill="rgba(50,240,140,0.55)"/>
    <path d="M -38 28 L -10 -2 L 8 16 L 22 2 L 38 28 Z" fill="rgba(255,255,255,0.14)"/>
  </g>

  <!-- 品牌色装饰线 -->
  <rect x="270" y="272" width="60" height="3" rx="1.5" fill="url(#accent)" opacity="0.7"/>

  <text x="300" y="308" text-anchor="middle" fill="#52525b" font-size="15"
        font-family="Arial, 'Helvetica Neue', sans-serif" letter-spacing="2">NO IMAGE</text>
</svg>
